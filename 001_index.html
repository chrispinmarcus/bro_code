<body>
  <table class="container">
    <tr>
      <td colspan="4"><input type="text" placeholder="0"></td>

    </tr>
    <tr>
      <td><button>%</button></td>
      <td><button>CE</button></td>
      <td><button>C</button></td>
      <td><button>Del</button></td>
    </tr>
    <tr>
      <td><button>1/X</button></td>
      <td><button><span>x <sup>2</sup></span></button></td>
      <td><button>x/y</button></td>
      <td><button>Div</button></td>
    </tr>
    <tr>
      <td><button>7</button></td>
      <td><button>8</button></td>
      <td><button>9</button></td>
      <td><button>X</button></td>
    </tr>
    <tr>
      <td><button>4</button></td>
      <td><button>5</button></td>
      <td><button>6</button></td>
      <td><button>-</button></td>
    </tr>
    <tr>
      <td><button>1</button></td>
      <td><button>2</button></td>
      <td><button>3</button></td>
      <td><button>+</button></td>
    </tr>
    <tr>
      <td><button>+/_</button></td>
      <td><button>0</button></td>
      <td><button>.</button></td>
      <td><button id="btn">=</button></td>
    </tr>
  </table>
</body>
